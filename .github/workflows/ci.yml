name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Nothing here writes to the repository, so the token cannot either.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the "engines.node" range in package.json.
        node-version: ['22', '24', '26']

    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # --ignore-scripts skips the "prepare" hook, which would build before the
      # lint step had a chance to run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # Builds first, then runs the suite against the compiled plugin.
      - name: Build and test
        run: npm test

  # The Matter layer against each supported Homebridge's real Matter server and
  # real matter.js endpoints — the part of the plugin that has broken between
  # Homebridge releases. The plugin builds against the newest Homebridge's
  # types, then runs against each release in turn; see scripts/verify-matter.mjs.
  matter:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every Homebridge minor release with Matter support worth testing.
        homebridge: ['2.2.1', '2.3.1', '2.4.0']

    name: Matter on Homebridge ${{ matrix.homebridge }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Install Homebridge ${{ matrix.homebridge }}
        run: |
          npm install --prefix "$RUNNER_TEMP/homebridge" --no-save --ignore-scripts \
            --no-audit --no-fund "homebridge@$HOMEBRIDGE_VERSION"
        env:
          HOMEBRIDGE_VERSION: ${{ matrix.homebridge }}

      - name: Verify the Matter layer
        run: node scripts/verify-matter.mjs
        env:
          HOMEBRIDGE_MODULES: ${{ runner.temp }}/homebridge/node_modules
