name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Needed by the final step to create the GitHub Release.
      contents: write
      # Lets npm trade a GitHub OIDC token for a short-lived publish
      # credential ("trusted publishing"). This replaces NPM_PUBLISH_TOKEN:
      # there is no secret to rotate and nothing to expire mid-release, which
      # is exactly how 1.0.6 failed — the token hit its 90-day limit between
      # two releases. It also gets the published tarball a provenance
      # attestation linking it back to this workflow run.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # `registry-url` is deliberately NOT set here. It makes setup-node write
      # an .npmrc pinning the auth token to ${NODE_AUTH_TOKEN}, which is now
      # unset — npm would then present an empty credential instead of falling
      # through to OIDC. registry.npmjs.org is npm's default anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of the npm
      # bundled with Node 22. Pinning it makes the requirement explicit rather
      # than resting on whatever the runner image happens to ship today.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Everything that can reject the release runs before the publish step,
      # because npm publish is effectively irreversible.
      - name: Check tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $tag_version," \
                 "but package.json is $pkg_version." >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          .github/scripts/extract-changelog.sh "${GITHUB_REF_NAME#v}" \
            > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish
        run: npm publish --access public --provenance

      # A tag alone does not create a GitHub Release, and the Homebridge UI
      # reads its "what's new" text from the Releases API — without this the
      # plugin update shows no notes.
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
